<head>

<body>
    <h1>Pedido Pizza</h1>
    <form method="post" action="teste.jsp">

        Nome:
        <input type="text" name="nome">
        <br>

        Email:
        <input type="email" name="email">
        <br>

        Tamanho:
        <input type="radio" name="tamanho" value="g" checked> Grande
        <input type="radio" name="tamanho" value="m"> Médio
        <input type="radio" name="tamanho" value="p"> Pequeno
        <br>

        Sabor:
        <select name="sabor" id="">
            <option value="">calabresa</option>
            <option value="">Napolitana</option>
            <option value="">Marguerita</option>
        </select>
        <br>

        Adicionais:
        <input type="checkbox" name="borda recheada" value="sim"> Borda
        <input type="checkbox" name="Queijo" value="sim"> Queijo Extra
        <br>

        Data Entrega:
        <input type="date" name="dataEntrega">
        <br>

        Comentário: <br>
        <textarea name="mensagem" rows="10" cols="30"></textarea>
        <br>
        <input type="submit">
        <br>



    </form>
</body>
</html>
